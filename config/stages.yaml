# Per-stage configuration. Model diversity between Hunt and Validate is
# load-bearing: it implements the blog's "deliberate disagreement" rule.
# Trace runs on Opus because the paper calls it "the stage that matters most."

defaults:
  max_turns: 25000
  permission_mode: acceptEdits   # never bypassPermissions
  repair_attempts: 1             # one re-emit chance on schema-validation failure

stages:
  recon:
    model: MiniMax-M3
    concurrency: 1
    tools: [Read, Grep, Glob, Bash]
    max_turns: 60000                # recon can be long
    repair_attempts: 2           # critical one-shot; spend a second repair turn if needed
  hunt:
    model: MiniMax-M3
    concurrency: 1
    tools: [Read, Grep, Glob, Bash]
  validate:
    model: MiniMax-M3       # different from hunt — deliberate disagreement
    concurrency: 1
    tools: [Read, Grep, Glob]     # no Bash: pure analysis
  gapfill:
    model: MiniMax-M3
    concurrency: 1
    tools: [Read, Grep, Glob]
    repair_attempts: 2
  dedupe:
    model: MiniMax-M3
    concurrency: 1
    tools: [Read]
  trace:
    model: MiniMax-M3        # most critical stage
    concurrency: 1
    tools: [Read, Grep, Glob, Bash]
  feedback:
    model: MiniMax-M3
    concurrency: 1
    tools: [Read, Grep, Glob]
    repair_attempts: 2
  report:
    model: MiniMax-M3
    concurrency: 1
    tools: [Read]

# Bounded loops to prevent runaway cost
loops:
  gapfill_per_run: 1     # max Hunt → Validate → Gapfill cycles (per-run soft cap)
  feedback_per_run: 1    # one feedback pass after Trace (per-run soft cap)
  max_iterations:        # per-run-id hard cap, persisted in DB, survives --resume
    gapfill: 1
    feedback: 1
